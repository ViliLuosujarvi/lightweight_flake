# -------- Variables -------------------------

$terminal = foot
$menu = rofi -show drun -show-icons

# VM-friendly: SUPER is usually grabbed by the host OS, so use CTRL+ALT.
# (CTRL+ALT+F1..F12 is the VT switch, so don't bind plain F-keys to it.)
$mainMod = CTRL ALT


# -------- Master settings --------------------

#bind = $mainMod, J, layoutmsg, cyclenext
#bind = $mainMod, K, layoutmsg, cycleprev
#bind = $mainMod SHIFT, J, layoutmsg, rollprev
#bind = $mainMod SHIFT, K, layoutmsg, rollnext
#bind = ALT, J, layoutmsg, swapnext
#bind = ALT, K,layoutmsg ,swapprev
#bind = $mainMod, I, layoutmsg, addmaster
#bind = $mainMod, O, layoutmsg, removemaster
#bind = $mainMod SHIFT, TAB, layoutmsg, swapwithmaster
#bind = $mainMod SHIFT, M, layoutmsg, swapwithmaster
#bind = $mainMod, TAB, layoutmsg, focusmaster
#bind = $mainMod SHIFT, H, layoutmsg, mfact +0.18
#bind = $mainMod SHIFT, L, layoutmsg, mfact -0.18
#bind = $mainMod, H, layoutmsg, mfact +0.03
#bind = $mainMod, L, layoutmsg, mfact -0.03
#binde = ALT CTRL, H, resizeactive, 0 -60
#binde = ALT CTRL, L, resizeactive, 0 60


# -------- Dwindle settings  ------------------

# Focus movement
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# move window tree
bind = ALT, H,  swapwindow, l
bind = ALT, L, swapwindow, r
bind = ALT, K, swapwindow, u
bind = ALT, J, swapwindow, d

# cycle windows 
bind = $mainMod, TAB, cyclenext
bind = $mainMod, A, cyclenext, prev

# RESIZE
binde = $mainMod SHIFT, H, resizeactive, -70 0
binde = $mainMod SHIFT, L, resizeactive, 70 0
binde = $mainMod SHIFT, J, resizeactive, 0 70
binde = $mainMod SHIFT, K, resizeactive, 0 -70

# switch layout
bind = $mainMod SHIFT, F1, exec, hyprctl keyword general:layout master
bind = $mainMod SHIFT, F2, exec, hyprctl keyword general:layout dwindle

# change the split orientation
bind = ALT, TAB, layoutmsg, togglesplit

# -------- General applications --------------

bind = $mainMod, N, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit,

bind = $mainMod, R, exec, $menu
bind = $mainMod, F, exec, firefox
bind = $mainMod SHIFT, F, exec, firefox --private-window

bind = $mainMod, B, exec, foot btop --config ~/.config/btop/btop.conf
# -------- Workspaces ------------------------

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# -------- Mouse settings -------------------

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# -------- Volume Settings -----------------

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# -------- NumLock -----------------------
bind = , Num_Lock, exec, hyprctl dispatch nop
