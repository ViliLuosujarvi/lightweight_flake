# Trimmed, VM-friendly Hyprland config in the style of
# github.com/ViliLuosujarvi/.dotfiles (hosts/Laptop, NanSuS-Laptop).

monitor = , preferred, auto, 1

$terminal = foot
$editor = foot -e kak
$mainMod = SUPER

exec-once = waybar

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1

# Most VMs have no real GPU acceleration. If Hyprland fails to start or
# renders garbage, uncomment these to fall back to software rendering:
# env = LIBGL_ALWAYS_SOFTWARE,1
# env = WLR_RENDERER_ALLOW_SOFTWARE,1

general {
    layout = dwindle
    gaps_in = 3
    gaps_out = 4
    border_size = 2
    col.active_border = rgba(955ae7ee)
    col.inactive_border = rgba(1a092dee)
    resize_on_border = true
}

dwindle {
    preserve_split = true
    force_split = 2
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.85
    dim_inactive = true
    dim_strength = 0.2

    shadow {
        enabled = true
        range = 3
        render_power = 4
        color = rgba(1e0528cc)
    }

    # Kept light on purpose - this is meant to run without a GPU.
    blur {
        enabled = true
        size = 2
        passes = 2
    }
}

animations {
    enabled = yes
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = overshot, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, wind, slide
    animation = windowsOut, 1, 3, wind, slide
    animation = border, 1, 1, liner
    animation = fade, 1, 3, default
    animation = workspaces, 1, 4, overshot
}

input {
    kb_layout = us
    follow_mouse = 1
    numlock_by_default = true
    touchpad {
        natural_scroll = false
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# -------- Keybinds --------

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $editor
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, E, exit

# Focus movement (hjkl, vim-style)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Swap windows
bind = $mainMod ALT, H, swapwindow, l
bind = $mainMod ALT, L, swapwindow, r
bind = $mainMod ALT, K, swapwindow, u
bind = $mainMod ALT, J, swapwindow, d

# Resize
binde = $mainMod SHIFT, H, resizeactive, -40 0
binde = $mainMod SHIFT, L, resizeactive, 40 0
binde = $mainMod SHIFT, K, resizeactive, 0 -40
binde = $mainMod SHIFT, J, resizeactive, 0 40

bind = $mainMod, TAB, cyclenext
bind = ALT, TAB, layoutmsg, togglesplit

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
