# Adapted from github.com/ViliLuosujarvi/.dotfiles (hosts/Laptop, NanSuS-Laptop).
# Font line intentionally omitted - their config pins "FiraCode Nerd Font
# Mono", which isn't installed here. foot falls back to its built-in default
# monospace font. Add a Nerd Font package and a `font=` line here to match
# their exact look (needed for icon glyphs anyway, see waybar notes).

[main]
pad=10x5
line-height=20px

[scrollback]
lines=10000

[cursor]
style=block
unfocused-style=hollow

[mouse]
hide-when-typing=true

[key-bindings]
clipboard-copy=Control+c XF86Copy
clipboard-paste=Control+v XF86Paste

[search-bindings]
cancel=Control+g Control+Shift+c Escape

[url-bindings]
cancel=Control+g Control+Shift+c Control+d Escape

[colors]
background=0a0a20
foreground=ffffff

regular0=d32f2f
regular1=ff4081
regular2=4caf50
regular3=ffeb3b
regular4=2196f3
regular5=9c27b0
regular6=00bcd4
regular7=607d8b

bright0=ff5722
bright1=ff9800
bright2=00e676
bright3=cddc39
bright4=009688
bright5=673ab7
bright6=3f51b5
bright7=ffffff
